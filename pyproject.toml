[project]
name = "upbit-momentum-auto-trader"
version = "0.1.0"
description = "Upbit momentum auto trading service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "certifi>=2025.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "structlog>=25.0.0,<26.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
ml = [
  "pandas>=2.2.0,<3.0.0",
  "pyarrow>=16.0.0,<23.0.0",
  "scikit-learn>=1.5.0,<2.0.0",
  "tensorflow>=2.16.0,<3.0.0",
]

[project.scripts]
upbit-train-model = "app.cli.train_model:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
